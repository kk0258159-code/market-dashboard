name: Auto Update Market Data

on:
  # 設定自動執行排程：這裡設定為每隔 30 分鐘自動執行一次 (您可以自行修改 cron 語法)
  schedule:
    - cron: '*/30 * * * *'
  
  # 允許您在 GitHub 網頁手動點擊按鈕立即執行
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取得專案程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          pip install --upgrade pip
          pip install yfinance requests

      - name: 4. 執行 Python 爬蟲腳本
        run: python fetch_data.py

      - name: 5. 自動將更新後的 json 寫回倉庫
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add market_data.json
          git commit -m "Auto-update market data: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
